<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RE: SCIENCE LAB - 체세포 분열 & 개체 성장 챌린지</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap');
        * { box-sizing: border-box; touch-action: none; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #000000; color: #f8fafc; overflow: hidden; margin: 0; padding: 0; }
        .hud-font { font-family: 'Chakra Petch', monospace; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between bg-black select-none">

    <!-- 상단 사이버네틱 HUD 바 -->
    <header class="w-full h-11 bg-slate-950/90 border-b border-cyan-500/40 px-6 flex justify-between items-center z-30 shadow-lg">
        <div class="flex items-center space-x-4">
            <span class="hud-font font-black text-cyan-400 text-lg tracking-widest">RE: SCIENCE LAB</span>
            <span class="hud-font text-amber-300 text-xs font-bold bg-amber-400/10 px-2.5 py-0.5 rounded border border-amber-400/30">
                단계: <span id="stage-text">1단계 (수정란)</span>
            </span>
        </div>

        <div class="flex items-center space-x-6 hud-font text-sm font-bold tracking-wider">
            <div class="text-slate-300">ATP: <span id="score-text" class="text-amber-400 text-base font-black">0000</span></div>
            <div class="text-slate-300">CELLS: <span id="cells-text" class="text-cyan-400 text-base font-black">1</span></div>
            <div class="text-slate-300">TIME: <span id="time-text" class="text-amber-400 text-base font-black">60.0</span></div>
        </div>
    </header>

    <!-- 메인 시뮬레이션 영역 -->
    <main class="relative flex-1 w-full h-full overflow-hidden flex items-center justify-center">
        <!-- 웹캠 비디오 (숨김 처리 후 캔버스 배경에 어둡게 직접 렌더링) -->
        <video id="webcam" class="hidden" playsinline autoplay muted></video>

        <!-- 전체 시뮬레이션 캔버스 -->
        <canvas id="simCanvas" class="w-full h-full block"></canvas>

        <!-- 시작 모달 팝업 -->
        <div id="start-modal" class="absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-40">
            <div class="flex flex-col items-center text-center p-8 max-w-lg">
                <div class="text-cyan-400 text-4xl mb-3">⏳</div>
                <h2 class="text-2xl font-black text-white mb-3 tracking-wide drop-shadow-[0_0_15px_rgba(34,211,238,0.9)]">
                    체세포 분열 & 개체 성장 챌린지
                </h2>
                <p class="text-xs text-slate-300 leading-relaxed mb-6 font-medium">
                    세포가 자라나면 <span class="text-cyan-300 font-bold">검지로 슬라이스</span>하여 세포 수를 늘리세요!<br>
                    세포 분열이 진행될수록 <span class="text-amber-300 font-bold">[수정란 → 배아 → 태아 → 어린이 → 성인]</span>으로 개체가 커지며 공간이 넓어집니다.<br>
                    우측 렉에서 <span class="text-rose-400 font-bold">엄지·검지로 혈관을 끌어와</span> 세포 틈새에 배치하여 최대 ATP를 생산하세요!
                </p>
                <button onclick="startGame()" class="px-8 py-3 bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black rounded-full shadow-[0_0_20px_rgba(34,211,238,0.7)] transition active:scale-95 text-sm">
                    🚀 게임 시작하기 (S / Touch / Click)
                </button>
            </div>
        </div>
    </main>

    <!-- 하단 상태 및 컨트롤 바 -->
    <footer class="w-full h-8 bg-slate-950/90 border-t border-cyan-500/30 px-4 flex justify-between items-center text-[11px] z-30 text-slate-400">
        <div class="flex space-x-2">
            <button onclick="startGame()" class="bg-cyan-950/60 border border-cyan-500/50 text-cyan-300 px-3 py-0.5 rounded font-bold hover:bg-cyan-900">시작 (S)</button>
            <button onclick="resetGame()" class="bg-slate-900 border border-slate-700 text-slate-300 px-3 py-0.5 rounded font-bold hover:bg-slate-800">리셋 (R)</button>
        </div>
        <div class="flex space-x-2">
            <span id="cam-status" class="bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 px-2.5 py-0.5 rounded font-bold">웹캠: 연결 중...</span>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam');
        const startModal = document.getElementById('start-modal');
        const camStatus = document.getElementById('cam-status');

        let isPlaying = false;
        let timeLeft = 60.0;
        let timerId = null;
        let score = 0;
        let stage = 1;

        let cells = [];
        let placedVessels = [];
        let handLandmarks = null;
        let isProcessing = false;
        let lastSliceTime = 0;
        let draggingVessel = null;

        // 우측 혈관 인벤토리 슬롯 (4개)
        const inventory = {
            width: 65,
            slots: 4,
            items: [true, true, true, true]
        };

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function resetGame() {
            clearInterval(timerId);
            isPlaying = false;
            timeLeft = 60.0;
            score = 0;
            stage = 1;
            inventory.items = [true, true, true, true];
            placedVessels = [];
            draggingVessel = null;

            // 초기 수정란 1개
            cells = [{
                x: canvas.width * 0.43,
                y: canvas.height * 0.5,
                radius: 52,
                growthRate: 0.04,
                maxRadius: 75,
                vx: 0,
                vy: 0,
                isSupplied: false
            }];

            document.getElementById('time-text').innerText = "60.0";
            document.getElementById('score-text').innerText = "0000";
            document.getElementById('cells-text').innerText = "1";
            startModal.classList.remove('hidden');
            updateHUD();
        }

        function startGame() {
            if (isPlaying) return;
            resetGame();
            isPlaying = true;
            startModal.classList.add('hidden');

            timerId = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    clearInterval(timerId);
                    isPlaying = false;
                    alert(`⏰ 탐구 종료!\n최종 생산 ATP: ${Math.floor(score)}\n세포 수: ${cells.length}개\n배치된 혈관 수: ${placedVessels.length}개`);
                    startModal.classList.remove('hidden');
                }
                document.getElementById('time-text').innerText = timeLeft.toFixed(1);
            }, 100);
        }

        function updateHUD() {
            const stageNames = ["1단계 (수정란)", "2단계 (배아)", "3단계 (태아)", "4단계 (어린이)", "5단계 (성인)"];
            if (cells.length >= 18) stage = 5;
            else if (cells.length >= 12) stage = 4;
            else if (cells.length >= 7) stage = 3;
            else if (cells.length >= 3) stage = 2;
            else stage = 1;

            document.getElementById('stage-text').innerText = stageNames[stage - 1];
            document.getElementById('cells-text').innerText = cells.length;
            document.getElementById('score-text').innerText = String(Math.floor(score)).padStart(4, '0');
        }

        // 키보드 단축키 지원 (S: 시작, R: 리셋)
        window.addEventListener('keydown', (e) => {
            if (e.key === 's' || e.key === 'S' || e.key === 'ㄴ') startGame();
            if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') resetGame();
        });

        // MediaPipe Hands 설정
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            isProcessing = false;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handLandmarks = results.multiHandLandmarks[0];
                camStatus.innerText = "웹캠: 켜짐 (인식 중)";
                camStatus.className = "bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 px-2.5 py-0.5 rounded font-bold";
            } else {
                handLandmarks = null;
                camStatus.innerText = "웹캠: 손 감지 대기";
                camStatus.className = "bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 px-2.5 py-0.5 rounded font-bold";
            }
        });

        const camera = new Camera(video, {
            onFrame: async () => {
                if (!isProcessing) {
                    isProcessing = true;
                    await hands.send({ image: video });
                }
            },
            width: 640,
            height: 480
        });

        camera.start().catch(() => {
            camStatus.innerText = "웹캠: 권한 필요";
        });

        // 물리 연산 및 인터랙션 처리
        function updatePhysics() {
            let cx = canvas.width * 0.43;
            let cy = canvas.height * 0.5;
            let baseRadiusX = canvas.width * 0.22;
            let baseRadiusY = canvas.height * 0.36;
            let scale = 0.75 + (stage - 1) * 0.08;
            let currentRX = baseRadiusX * scale;
            let currentRY = baseRadiusY * scale;

            // 우측 인벤토리 위치
            let invX = canvas.width - 110;
            let invY = canvas.height * 0.15;
            let invH = canvas.height * 0.7;
            let slotH = invH / inventory.slots;

            // 1. 손 제스처 처리 (엄지·검지 핀치 & 검지 슬라이스)
            if (handLandmarks) {
                let indexTip = handLandmarks[8];
                let thumbTip = handLandmarks[4];

                let ix = (1 - indexTip.x) * canvas.width;
                let iy = indexTip.y * canvas.height;
                let tx = (1 - thumbTip.x) * canvas.width;
                let ty = thumbTip.y * canvas.height;

                let pinchDist = Math.hypot(ix - tx, iy - ty);
                let isPinching = pinchDist < 42;
                let midX = (ix + tx) / 2;
                let midY = (iy + ty) / 2;

                // [인벤토리 잡기 & 드래그]
                if (isPinching) {
                    if (!draggingVessel) {
                        for (let s = 0; s < inventory.slots; s++) {
                            if (inventory.items[s]) {
                                let slotCenterY = invY + s * slotH + slotH / 2;
                                let slotCenterX = invX + inventory.width / 2;
                                if (Math.hypot(midX - slotCenterX, midY - slotCenterY) < 35) {
                                    draggingVessel = { slotIndex: s, x: midX, y: midY };
                                    inventory.items[s] = false;
                                    break;
                                }
                            }
                        }
                    } else {
                        draggingVessel.x = midX;
                        draggingVessel.y = midY;
                    }
                } else {
                    // 손을 떼었을 때 (Drop)
                    if (draggingVessel) {
                        let normalizedDist = Math.pow((draggingVessel.x - cx) / currentRX, 2) + Math.pow((draggingVessel.y - cy) / currentRY, 2);
                        if (normalizedDist <= 0.92) {
                            placedVessels.push({ x: draggingVessel.x, y: draggingVessel.y, radius: 18 });
                        } else {
                            inventory.items[draggingVessel.slotIndex] = true; // 개체 밖이면 인벤토리로 원복
                        }
                        draggingVessel = null;
                    }
                }

                // [검지 슬라이스로 세포 분열]
                let now = Date.now();
                if (now - lastSliceTime > 300) {
                    for (let i = cells.length - 1; i >= 0; i--) {
                        let c = cells[i];
                        let d = Math.hypot(ix - c.x, iy - c.y);
                        if (d < c.radius && c.radius > 20 && cells.length < 35) {
                            let newR = c.radius * 0.76;
                            c.radius = newR;
                            cells.push({
                                x: c.x + (Math.random() - 0.5) * 20,
                                y: c.y + (Math.random() - 0.5) * 20,
                                radius: newR,
                                growthRate: 0.04,
                                maxRadius: 65,
                                vx: (Math.random() - 0.5) * 0.8,
                                vy: (Math.random() - 0.5) * 0.8,
                                isSupplied: false
                            });
                            lastSliceTime = now;
                            break;
                        }
                    }
                }
            }

            // 2. 세포 상태 판별 (혈관 공급) 및 ATP 점수 계산
            cells.forEach(c => {
                if (c.radius < c.maxRadius) c.radius += c.growthRate;

                // 혈관 반경 내에 있으면 공급됨 (청록색)
                c.isSupplied = placedVessels.some(v => Math.hypot(c.x - v.x, c.y - v.y) < 85);

                if (isPlaying) {
                    if (c.isSupplied) {
                        // 작게 분열될수록 표면적비 증가로 고득점
                        score += (0.2 + (1 / c.radius) * 7.5);
                    } else {
                        score += 0.01;
                    }
                }
            });

            // 3. 세포 간 완충 물리 반발
            for (let i = 0; i < cells.length; i++) {
                for (let j = i + 1; j < cells.length; j++) {
                    let dx = cells[j].x - cells[i].x;
                    let dy = cells[j].y - cells[i].y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = cells[i].radius + cells[j].radius + 3;
                    if (dist < minDist && dist > 0) {
                        let overlap = (minDist - dist) * 0.12;
                        let nx = dx / dist;
                        let ny = dy / dist;
                        cells[i].x -= nx * overlap;
                        cells[i].y -= ny * overlap;
                        cells[j].x += nx * overlap;
                        cells[j].y += ny * overlap;
                    }
                }
            }

            // 4. 개체 타원형 경계 내 세포 가두기
            cells.forEach(c => {
                c.x += c.vx;
                c.y += c.vy;
                c.vx *= 0.95;
                c.vy *= 0.95;

                let nx = (c.x - cx) / (currentRX - c.radius);
                let ny = (c.y - cy) / (currentRY - c.radius);
                let d = nx * nx + ny * ny;
                if (d > 1) {
                    let angle = Math.atan2(ny, nx);
                    c.x = cx + Math.cos(angle) * (currentRX - c.radius);
                    c.y = cy + Math.sin(angle) * (currentRY - c.radius);
                }
            });

            updateHUD();
        }

        // 전체 화면 그리기 루프
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 배경 어두운 비디오 렌더링 (거울 모드 반전)
            if (video.readyState === 4) {
                ctx.save();
                ctx.globalAlpha = 0.28;
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            let cx = canvas.width * 0.43;
            let cy = canvas.height * 0.5;
            let baseRadiusX = canvas.width * 0.22;
            let baseRadiusY = canvas.height * 0.36;
            let scale = 0.75 + (stage - 1) * 0.08;
            let currentRX = baseRadiusX * scale;
            let currentRY = baseRadiusY * scale;

            // 2. 개체 타원형 경계선 (네온 청록색)
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(cx, cy, currentRX, currentRY, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
            ctx.fill();
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 3.5;
            ctx.shadowColor = '#22d3ee';
            ctx.shadowBlur = 14;
            ctx.stroke();

            // 개체 상단 라벨
            ctx.fillStyle = '#67e8f9';
            ctx.font = 'bold 12px Noto Sans KR';
            ctx.textAlign = 'center';
            ctx.fillText(document.getElementById('stage-text').innerText, cx, cy - currentRY - 8);
            ctx.restore();

            // 3. 배치된 혈관 렌더링
            placedVessels.forEach(v => {
                // 혈관 확산 범위
                ctx.beginPath();
                ctx.arc(v.x, v.y, 65, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(244, 63, 94, 0.12)';
                ctx.fill();

                // 혈관 캡슐 코어
                ctx.beginPath();
                ctx.arc(v.x, v.y, v.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#e11d48';
                ctx.fill();
                ctx.strokeStyle = '#fda4af';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(v.x, v.y, v.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = '#881337';
                ctx.fill();
            });

            // 4. 세포 렌더링 (공급 여부에 따라 청록색 / 빨간색 전환)
            cells.forEach(c => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);

                if (c.isSupplied) {
                    // 영양소 공급받음 -> 청록색 (정상 활동)
                    ctx.fillStyle = 'rgba(6, 182, 212, 0.35)';
                    ctx.strokeStyle = '#22d3ee';
                    ctx.shadowColor = '#22d3ee';
                } else {
                    // 영양소 결핍 -> 빨간색 계열
                    ctx.fillStyle = 'rgba(225, 29, 72, 0.25)';
                    ctx.strokeStyle = '#f43f5e';
                    ctx.shadowColor = '#f43f5e';
                }

                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.stroke();

                // 세포핵
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.radius * 0.38, 0, Math.PI * 2);
                ctx.fillStyle = c.isSupplied ? '#083344' : '#1e1b4b';
                ctx.fill();
                ctx.restore();
            });

            // 5. 우측 인벤토리 렉 (슬롯 바)
            let invX = canvas.width - 110;
            let invY = canvas.height * 0.15;
            let invH = canvas.height * 0.7;
            let slotH = invH / inventory.slots;

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(invX, invY, inventory.width, invH);
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#22d3ee';
            ctx.shadowBlur = 8;
            ctx.strokeRect(invX, invY, inventory.width, invH);
            ctx.restore();

            for (let s = 0; s < inventory.slots; s++) {
                let slotCenterY = invY + s * slotH + slotH / 2;
                let slotCenterX = invX + inventory.width / 2;

                if (inventory.items[s]) {
                    ctx.beginPath();
                    ctx.arc(slotCenterX, slotCenterY, 18, 0, Math.PI * 2);
                    ctx.fillStyle = '#e11d48';
                    ctx.fill();
                    ctx.strokeStyle = '#fda4af';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(slotCenterX, slotCenterY, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#881337';
                    ctx.fill();
                }
            }

            // 드래그 중인 혈관
            if (draggingVessel) {
                ctx.beginPath();
                ctx.arc(draggingVessel.x, draggingVessel.y, 22, 0, Math.PI * 2);
                ctx.fillStyle = '#e11d48';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3.5;
                ctx.stroke();
            }

            // 6. 손 관절 스켈레톤 및 포인터 시각화
            if (handLandmarks) {
                const connections = [
                    [0,1],[1,2],[2,3],[3,4],
                    [0,5],[5,6],[6,7],[7,8],
                    [5,9],[9,10],[10,11],[11,12],
                    [9,13],[13,14],[14,15],[15,16],
                    [13,17],[17,18],[18,19],[19,20],[0,17]
                ];

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 2;
                connections.forEach(([i, j]) => {
                    let p1 = handLandmarks[i];
                    let p2 = handLandmarks[j];
                    ctx.beginPath();
                    ctx.moveTo((1 - p1.x) * canvas.width, p1.y * canvas.height);
                    ctx.lineTo((1 - p2.x) * canvas.width, p2.y * canvas.height);
                    ctx.stroke();
                });

                handLandmarks.forEach((p, idx) => {
                    let px = (1 - p.x) * canvas.width;
                    let py = p.y * canvas.height;
                    ctx.beginPath();
                    ctx.arc(px, py, idx === 8 ? 8 : 4, 0, Math.PI * 2);
                    ctx.fillStyle = idx === 8 ? '#22d3ee' : '#ffffff';
                    ctx.fill();
                });
            }
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        resetGame();
        loop();
    </script>
</body>
</html>
