<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RE: SCIENCE LAB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap');
        * { box-sizing: border-box; touch-action: none; }
        body { font-family: 'Pretendard', sans-serif; background-color: #0b0f19; color: #f8fafc; overflow: hidden; margin: 0; padding: 0; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); }
        .neon-border { border: 2px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between p-3 select-none">

    <!-- 상단 대시보드 (HUD) -->
    <header class="w-full glass-panel rounded-2xl px-5 py-3 flex justify-between items-center z-20 shadow-xl">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-black text-white tracking-wider">RE: SCIENCE LAB</h1>
            <div id="stage-badge-top" class="text-sm font-semibold text-slate-300">
                Stage: <span id="stage-text" class="text-cyan-400 font-bold">1단계 (수정란)</span>
            </div>
        </div>

        <div class="flex items-center space-x-6 text-sm font-semibold text-slate-300">
            <div>Cells: <span id="cell-count" class="font-extrabold text-cyan-400 text-base">1</span></div>
            <div>Vessels: <span id="vessel-count" class="font-extrabold text-rose-400 text-base">0</span></div>
            <div>ATP: <span id="score" class="font-black text-emerald-400 text-lg">0</span></div>
        </div>
    </header>

    <!-- 메인 시뮬레이션 영역 -->
    <main class="relative flex-1 my-2 rounded-3xl overflow-hidden glass-panel border border-slate-800 flex items-center justify-center">
        <!-- 캔버스 (세포 및 페트리 접시) -->
        <canvas id="simCanvas" class="w-full h-full block"></canvas>

        <!-- 좌측 상단 단계 뱃지 -->
        <div class="absolute top-4 left-4 z-20">
            <div id="stage-pill" class="px-4 py-1.5 rounded-xl text-sm font-bold bg-indigo-950/60 border border-indigo-500/40 text-indigo-200">
                단계: 1단계 (수정란)
            </div>
        </div>

        <!-- 우측 상단 웹캠 피드 창 -->
        <div class="absolute top-4 right-4 z-20 w-44 h-32 rounded-2xl overflow-hidden glass-panel border border-slate-700 shadow-2xl flex flex-col">
            <div class="px-3 py-1 bg-slate-900/80 text-[11px] font-bold text-slate-300 border-b border-slate-700">
                웹캠 피드
            </div>
            <div class="relative flex-1 bg-black">
                <video id="webcam" class="w-full h-full object-cover scale-x-[-1]" playsinline autoplay muted></video>
                <canvas id="pipCanvas" class="absolute inset-0 w-full h-full"></canvas>
            </div>
        </div>

        <!-- 하단 안내 오버레이 -->
        <div id="status-overlay" class="absolute bottom-4 left-1/2 -translate-x-1/2 glass-panel px-5 py-2 rounded-full text-xs font-semibold text-slate-300 pointer-events-none shadow-xl border border-white/10 z-20">
            카메라 연결 중...
        </div>
    </main>

    <!-- 하단 조작 바 -->
    <footer class="w-full glass-panel rounded-2xl p-2.5 flex justify-center items-center space-x-3 z-20">
        <button onclick="resetGame()" class="px-6 py-2 rounded-xl font-bold text-sm bg-cyan-500/20 border border-cyan-400 text-cyan-300 hover:bg-cyan-500/30 active:scale-95 transition">
            1. 연습 모드 (자유)
        </button>
        <button onclick="resetGame()" class="px-6 py-2 rounded-xl font-bold text-sm bg-slate-900 border border-emerald-500/40 text-emerald-400 hover:bg-slate-800 active:scale-95 transition">
            다시 세팅
        </button>
    </footer>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const pipCanvas = document.getElementById('pipCanvas');
        const pipCtx = pipCanvas.getContext('2d');
        const video = document.getElementById('webcam');
        const statusOverlay = document.getElementById('status-overlay');

        let score = 0;
        let stage = 1;
        let cells = [];
        let vessels = [];
        let handLandmarks = null;
        let isProcessing = false;
        let lastSliceTime = 0;
        let wasPinching = false;

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            pipCanvas.width = pipCanvas.clientWidth;
            pipCanvas.height = pipCanvas.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function resetGame() {
            score = 0;
            stage = 1;
            cells = [{
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: 50,
                vx: 0,
                vy: 0
            }];
            vessels = [];
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('cell-count').innerText = cells.length;
            document.getElementById('vessel-count').innerText = vessels.length;
            document.getElementById('score').innerText = score;

            const stageNames = ["1단계 (수정란)", "2단계 (배아)", "3단계 (태아)", "4단계 (어린이)", "5단계 (성인)"];
            if (cells.length >= 18) stage = 5;
            else if (cells.length >= 12) stage = 4;
            else if (cells.length >= 7) stage = 3;
            else if (cells.length >= 3) stage = 2;
            else stage = 1;

            document.getElementById('stage-text').innerText = stageNames[stage - 1];
            document.getElementById('stage-pill').innerText = `단계: ${stageNames[stage - 1]}`;
        }

        // MediaPipe Hands 설정
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            isProcessing = false;
            pipCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handLandmarks = results.multiHandLandmarks[0];
                statusOverlay.innerText = "손 인식 중: 검지로 자르기(Slice) | 엄지·검지 맞대기로 혈관 배치(Pinch)";

                // PiP 창에 손 랜드마크 시각화
                pipCtx.strokeStyle = '#22c55e';
                pipCtx.lineWidth = 2;
                handLandmarks.forEach(pt => {
                    let px = (1 - pt.x) * pipCanvas.width;
                    let py = pt.y * pipCanvas.height;
                    pipCtx.beginPath();
                    pipCtx.arc(px, py, 3, 0, Math.PI * 2);
                    pipCtx.fillStyle = '#4ade80';
                    pipCtx.fill();
                });
            } else {
                handLandmarks = null;
                statusOverlay.innerText = "웹캠 앞에 손을 보여주세요";
            }
        });

        const camera = new Camera(video, {
            onFrame: async () => {
                if (!isProcessing) {
                    isProcessing = true;
                    await hands.send({ image: video });
                }
            },
            width: 480,
            height: 360
        });

        camera.start().then(() => {
            statusOverlay.innerText = "웹캠 준비 완료!";
        }).catch(() => {
            statusOverlay.innerText = "웹캠 권한을 허용해주세요.";
        });

        function updatePhysics() {
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            let baseR = Math.min(canvas.width, canvas.height) * 0.38;
            let currentBoundaryR = baseR * (0.65 + (stage - 1) * 0.08);

            // 제스처 입력 연산
            if (handLandmarks) {
                let indexTip = handLandmarks[8];
                let thumbTip = handLandmarks[4];

                let ix = (1 - indexTip.x) * canvas.width;
                let iy = indexTip.y * canvas.height;
                let tx = (1 - thumbTip.x) * canvas.width;
                let ty = thumbTip.y * canvas.height;

                let pinchDist = Math.hypot(ix - tx, iy - ty);
                let isPinching = pinchDist < 38;

                // 핀치 (혈관 배치)
                if (isPinching && !wasPinching) {
                    if (Math.hypot(ix - cx, iy - cy) < currentBoundaryR - 20) {
                        vessels.push({ x: ix, y: iy, length: 70, angle: Math.PI / 4 });
                    }
                }
                wasPinching = isPinching;

                // 슬라이스 (세포 분열)
                let now = Date.now();
                if (now - lastSliceTime > 350) {
                    for (let i = cells.length - 1; i >= 0; i--) {
                        let cell = cells[i];
                        let d = Math.hypot(ix - cell.x, iy - cell.y);
                        if (d < cell.radius && cell.radius > 16 && cells.length < 32) {
                            let newR = cell.radius * 0.82;
                            cell.radius = newR;
                            cells.push({
                                x: cell.x + (Math.random() - 0.5) * 20,
                                y: cell.y + (Math.random() - 0.5) * 20,
                                radius: newR,
                                vx: (Math.random() - 0.5) * 0.5,
                                vy: (Math.random() - 0.5) * 0.5
                            });
                            lastSliceTime = now;
                            break;
                        }
                    }
                }
            }

            // 세포 간 충돌 및 완충 반발
            for (let i = 0; i < cells.length; i++) {
                for (let j = i + 1; j < cells.length; j++) {
                    let dx = cells[j].x - cells[i].x;
                    let dy = cells[j].y - cells[i].y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = cells[i].radius + cells[j].radius + 3;
                    if (dist < minDist && dist > 0) {
                        let overlap = (minDist - dist) * 0.1;
                        let nx = dx / dist;
                        let ny = dy / dist;
                        cells[i].x -= nx * overlap;
                        cells[i].y -= ny * overlap;
                        cells[j].x += nx * overlap;
                        cells[j].y += ny * overlap;
                    }
                }
            }

            // 세포 위치 갱신 및 경계 처리
            cells.forEach(cell => {
                cell.vx *= 0.92;
                cell.vy *= 0.92;
                cell.x += cell.vx;
                cell.y += cell.vy;

                let d = Math.hypot(cell.x - cx, cell.y - cy);
                let limit = currentBoundaryR - cell.radius;
                if (d > limit) {
                    let angle = Math.atan2(cell.y - cy, cell.x - cx);
                    cell.x = cx + Math.cos(angle) * limit;
                    cell.y = cy + Math.sin(angle) * limit;
                }
            });

            // 점수 연산
            let supplied = 0;
            cells.forEach(c => {
                let hasVessel = vessels.some(v => Math.hypot(c.x - v.x, c.y - v.y) < 70);
                if (hasVessel) supplied++;
            });
            score = cells.length * 20 + supplied * 30;

            updateHUD();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            let baseR = Math.min(canvas.width, canvas.height) * 0.38;
            let currentBoundaryR = baseR * (0.65 + (stage - 1) * 0.08);

            // 1. 개체 경계선 (네온 원형 접시)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, currentBoundaryR + 8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(99, 102, 241, 0.4)';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, currentBoundaryR, 0, Math.PI * 2);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, currentBoundaryR - 8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([8, 6]);
            ctx.stroke();
            ctx.restore();

            // 2. 혈관 렌더링 (주황/빨강 도관 형태)
            vessels.forEach(v => {
                ctx.save();
                ctx.translate(v.x, v.y);
                ctx.rotate(v.angle);

                // 확산 범위
                ctx.beginPath();
                ctx.roundRect(-15, -45, 30, 90, 15);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.12)';
                ctx.fill();

                // 혈관 몸체
                ctx.beginPath();
                ctx.roundRect(-8, -35, 16, 70, 8);
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.strokeStyle = '#fca5a5';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 내부 혈류선
                ctx.beginPath();
                ctx.moveTo(0, -25);
                ctx.lineTo(0, 25);
                ctx.strokeStyle = '#f87171';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            });

            // 3. 세포 렌더링
            cells.forEach(cell => {
                // 세포막/세포질
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, cell.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
                ctx.fill();
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#0284c7';
                ctx.shadowBlur = 8;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // 세포핵
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, cell.radius * 0.36, 0, Math.PI * 2);
                ctx.fillStyle = '#0284c7';
                ctx.fill();
                ctx.strokeStyle = '#bae6fd';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // 4. 손 인터랙션 포인터
            if (handLandmarks) {
                let indexTip = handLandmarks[8];
                let ix = (1 - indexTip.x) * canvas.width;
                let iy = indexTip.y * canvas.height;

                ctx.beginPath();
                ctx.arc(ix, iy, 7, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function loop() {
            updatePhysics();
            draw();
            requestAnimationFrame(loop);
        }

        resetGame();
        loop();
    </script>
</body>
</html>
