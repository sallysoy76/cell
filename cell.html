<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RE: SCIENCE LAB - 세포 분열 시뮬레이션</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        * { box-sizing: border-box; touch-action: none; }
        body { font-family: 'Pretendard', sans-serif; background-color: #030712; color: #f8fafc; overflow: hidden; margin: 0; padding: 0; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.12); }
        .hud-chip { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between p-3 select-none">

    <!-- 상단 네온 대시보드 (HUD) -->
    <header class="w-full glass-panel rounded-2xl p-3 flex justify-between items-center z-20 shadow-2xl">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 tracking-wider">
                RE: SCIENCE LAB
            </span>
            <span id="stage-badge" class="px-3 py-1 bg-cyan-500/20 border border-cyan-400/40 rounded-full text-cyan-300 text-xs font-extrabold tracking-wide">
                1단계 (수정란)
            </span>
        </div>

        <div class="flex items-center space-x-3 text-xs md:text-sm">
            <div class="hud-chip px-3 py-1.5 rounded-xl text-slate-300">
                세포: <span id="cell-count" class="font-extrabold text-cyan-400 text-base">1</span>개
            </div>
            <div class="hud-chip px-3 py-1.5 rounded-xl text-slate-300">
                혈관: <span id="vessel-count" class="font-extrabold text-emerald-400 text-base">0</span>개
            </div>
            <div class="hud-chip px-3 py-1.5 rounded-xl text-slate-300">
                시간: <span id="timer" class="font-extrabold text-amber-400 text-base">30</span>초
            </div>
            <div class="bg-gradient-to-r from-emerald-950 to-slate-900 border border-emerald-500/40 px-4 py-1.5 rounded-xl">
                ATP: <span id="score" class="font-black text-emerald-300 text-lg">0</span>
            </div>
        </div>
    </header>

    <!-- 메인 시뮬레이션 영역 -->
    <main class="relative flex-1 my-2 rounded-3xl overflow-hidden glass-panel border border-slate-800 flex items-center justify-center">
        <!-- 캔버스 (전체 렌더링) -->
        <canvas id="simCanvas" class="w-full h-full block"></canvas>

        <!-- 비디오 요소 (MediaPipe 소스) -->
        <video id="webcam" class="hidden" playsinline autoplay muted></video>

        <!-- 웹캠 상태 및 제스처 안내 오버레이 -->
        <div id="status-overlay" class="absolute bottom-4 left-1/2 -translate-x-1/2 glass-panel px-5 py-2 rounded-full text-xs font-semibold text-slate-300 pointer-events-none shadow-xl border border-white/10 z-20">
            카메라 연결 중... 잠시만 기다려주세요.
        </div>
    </main>

    <!-- 하단 조작 바 -->
    <footer class="w-full glass-panel rounded-2xl p-2.5 flex justify-center items-center space-x-4 z-20">
        <button id="btn-start" onclick="startGame()" class="px-6 py-2 rounded-xl font-extrabold text-sm bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 shadow-lg active:scale-95 transition">
            탐구 시작 (30초)
        </button>
        <button onclick="resetGame()" class="px-5 py-2 rounded-xl font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 active:scale-95 transition">
            다시 세팅
        </button>
    </footer>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam');
        const statusOverlay = document.getElementById('status-overlay');

        let isRunning = false;
        let timeLeft = 30;
        let timerInterval = null;
        let score = 0;
        let stage = 1;

        let cells = [];
        let vessels = [];
        let handLandmarks = null;
        let isProcessing = false;
        let lastSliceTime = 0;
        let wasPinching = false;

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function resetGame() {
            clearInterval(timerInterval);
            isRunning = false;
            timeLeft = 30;
            score = 0;
            stage = 1;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('score').innerText = score;
            document.getElementById('btn-start').innerText = "탐구 시작 (30초)";
            
            cells = [{
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: 46,
                vx: 0,
                vy: 0
            }];
            vessels = [];
            updateHUD();
        }

        function startGame() {
            if (isRunning) return;
            resetGame();
            isRunning = true;
            document.getElementById('btn-start').innerText = "탐구 진행 중...";
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    document.getElementById('btn-start').innerText = "다시 시작";
                    alert(`⏰ 탐구 종료!\n최종 세포 수: ${cells.length}개\n배치된 혈관: ${vessels.length}개\n총 생성 ATP: ${score}`);
                }
            }, 1000);
        }

        function updateHUD() {
            document.getElementById('cell-count').innerText = cells.length;
            document.getElementById('vessel-count').innerText = vessels.length;
            document.getElementById('score').innerText = score;

            const stageNames = ["1단계 (수정란)", "2단계 (배아)", "3단계 (태아)", "4단계 (어린이)", "5단계 (성인)"];
            if (cells.length >= 20) stage = 5;
            else if (cells.length >= 13) stage = 4;
            else if (cells.length >= 7) stage = 3;
            else if (cells.length >= 3) stage = 2;
            else stage = 1;

            document.getElementById('stage-badge').innerText = stageNames[stage - 1];
        }

        // MediaPipe Hands 설정
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            isProcessing = false;
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handLandmarks = results.multiHandLandmarks[0];
                statusOverlay.innerText = "손 인식 중: 검지로 세포 분열(Slice) | 엄지·검지 맞대기로 혈관 배치(Pinch)";
            } else {
                handLandmarks = null;
                statusOverlay.innerText = "카메라 앞에 손을 보여주세요";
            }
        });

        const camera = new Camera(video, {
            onFrame: async () => {
                if (!isProcessing) {
                    isProcessing = true;
                    await hands.send({ image: video });
                }
            },
            width: 480,
            height: 270
        });

        camera.start().then(() => {
            statusOverlay.innerText = "카메라 준비 완료! 손을 올려보세요.";
        }).catch(() => {
            statusOverlay.innerText = "카메라 권한을 허용해 주세요.";
        });

        function update() {
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            let baseR = Math.min(canvas.width, canvas.height) * 0.38;
            let currentBoundaryR = baseR * (0.65 + (stage - 1) * 0.08);

            // 제스처 입력 처리
            if (handLandmarks) {
                let indexTip = handLandmarks[8];
                let thumbTip = handLandmarks[4];

                let ix = (1 - indexTip.x) * canvas.width;
                let iy = indexTip.y * canvas.height;
                let tx = (1 - thumbTip.x) * canvas.width;
                let ty = thumbTip.y * canvas.height;

                let pinchDist = Math.hypot(ix - tx, iy - ty);
                let isPinching = pinchDist < 38;

                // 핀치: 혈관 배치
                if (isPinching && !wasPinching) {
                    if (Math.hypot(ix - cx, iy - cy) < currentBoundaryR - 15) {
                        vessels.push({ x: ix, y: iy, radius: 12 });
                    }
                }
                wasPinching = isPinching;

                // 슬라이스: 세포 분열
                let now = Date.now();
                if (now - lastSliceTime > 350) {
                    for (let i = cells.length - 1; i >= 0; i--) {
                        let cell = cells[i];
                        let d = Math.hypot(ix - cell.x, iy - cell.y);
                        if (d < cell.radius && cell.radius > 16 && cells.length < 32) {
                            let newR = cell.radius * 0.82;
                            cell.radius = newR;
                            cells.push({
                                x: cell.x + (Math.random() - 0.5) * 20,
                                y: cell.y + (Math.random() - 0.5) * 20,
                                radius: newR,
                                vx: (Math.random() - 0.5) * 0.5,
                                vy: (Math.random() - 0.5) * 0.5
                            });
                            lastSliceTime = now;
                            break;
                        }
                    }
                }
            }

            // 세포 간 반발 물리 (젤리처럼 부드러운 완충)
            for (let i = 0; i < cells.length; i++) {
                for (let j = i + 1; j < cells.length; j++) {
                    let dx = cells[j].x - cells[i].x;
                    let dy = cells[j].y - cells[i].y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = cells[i].radius + cells[j].radius + 3;
                    if (dist < minDist && dist > 0) {
                        let overlap = (minDist - dist) * 0.1;
                        let nx = dx / dist;
                        let ny = dy / dist;
                        cells[i].x -= nx * overlap;
                        cells[i].y -= ny * overlap;
                        cells[j].x += nx * overlap;
                        cells[j].y += ny * overlap;
                    }
                }
            }

            // 세포 이동 감쇄 및 경계 처리
            cells.forEach(cell => {
                cell.vx *= 0.92;
                cell.vy *= 0.92;
                cell.x += cell.vx;
                cell.y += cell.vy;

                let d = Math.hypot(cell.x - cx, cell.y - cy);
                let limit = currentBoundaryR - cell.radius;
                if (d > limit) {
                    let angle = Math.atan2(cell.y - cy, cell.x - cx);
                    cell.x = cx + Math.cos(angle) * limit;
                    cell.y = cy + Math.sin(angle) * limit;
                }
            });

            // ATP 계산 (세포 수 + 혈관 공급 효율)
            if (isRunning) {
                let supplied = 0;
                cells.forEach(c => {
                    let hasVessel = vessels.some(v => Math.hypot(c.x - v.x, c.y - v.y) < 70);
                    if (hasVessel) supplied++;
                });
                score += (cells.length * 2 + supplied * 8);
            }

            updateHUD();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            let baseR = Math.min(canvas.width, canvas.height) * 0.38;
            let currentBoundaryR = baseR * (0.65 + (stage - 1) * 0.08);

            // 1. 개체 성장 경계선 (네온 원형)
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, currentBoundaryR, 0, Math.PI * 2);
            ctx.strokeStyle = stage === 5 ? '#38bdf8' : (stage >= 3 ? '#a855f7' : '#34d399');
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 6]);
            ctx.stroke();
            ctx.restore();

            // 2. 혈관 렌더링
            vessels.forEach(v => {
                // 확산 범위
                ctx.beginPath();
                ctx.arc(v.x, v.y, 65, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.08)';
                ctx.fill();

                // 혈관 코어
                ctx.beginPath();
                ctx.arc(v.x, v.y, v.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.strokeStyle = '#fca5a5';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // 3. 세포 렌더링
            cells.forEach(cell => {
                // 세포질
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, cell.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(14, 165, 233, 0.28)';
                ctx.fill();
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                // 핵
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, cell.radius * 0.38, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.7)';
                ctx.fill();
            });

            // 4. 손 포인터 UI (화면에 시각화)
            if (handLandmarks) {
                let indexTip = handLandmarks[8];
                let ix = (1 - indexTip.x) * canvas.width;
                let iy = indexTip.y * canvas.height;

                ctx.beginPath();
                ctx.arc(ix, iy, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        resetGame();
        loop();
    </script>
</body>
</html>
